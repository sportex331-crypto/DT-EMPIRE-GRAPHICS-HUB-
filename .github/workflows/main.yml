name: Build DT Empire APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o DT_Empire_Digital_Hub_App_v2.zip
          cd DT_Empire_Digital_Hub_App_v2/android
          echo "Android project extracted"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build APK
        working-directory: DT_Empire_Digital_Hub_App_v2/android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DT-Empire-Digital-Hub-APK
          path: DT_Empire_Digital_Hub_App_v2/android/app/build/outputs/apk/debug/app-debug.apk
